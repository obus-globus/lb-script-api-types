name: typecheck

# Gates for the committed types tree — no regeneration / JVM / Xvfb involved.
#   typecheck: surface smoke tests + whole-package syntax ratchet +
#              import-resolution + semantic surface check (see
#              docs/typecheck-gate.md).
#   package-canary: npm-packs typings/ and compiles a probe consumer against
#              the installed tarball with a stock tsconfig — catches
#              files-glob / typesVersions / silent-any packaging breakage.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # The generator submodule is not needed — the gate runs against the
        # committed typings/ tree.
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Typecheck gate
        run: npm run typecheck

  package-canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Packaging canary (pack → install → consumer tsc)
        run: npm run canary
