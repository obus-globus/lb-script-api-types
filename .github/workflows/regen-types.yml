name: Regenerate script-api types

# Runs the WHOLE type-generation flow (build generator -> headless LiquidBounce
# introspection -> apply-kdoc + fix-binding -> promote) inside the regen container,
# then opens a PR if the committed typings/ changed.
#
# NOTE: the flow launches a real Minecraft client headlessly (~50-60 min on Mesa
# softpipe) and downloads several GB of Gradle/MC deps. GitHub-hosted runners are
# resource-constrained (2 vCPU / ~14 GB disk) - this may be slow or run out of
# disk; a larger or self-hosted runner is recommended for routine use. The Gradle
# cache is persisted across runs to skip the re-downloads.
on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promote regen output into typings/ and open a PR"
        type: boolean
        default: true
      skip_regen:
        description: "Skip the headless regen; reuse an existing tools/regen-output/ (fast re-promote / CI validation)"
        type: boolean
        default: false
  # Uncomment to check weekly for upstream drift:
  # schedule:
  #   - cron: "0 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Never mount the workflow token into the regen container (it runs
          # upstream LiquidBounce gradle code) - see check-regen.yml. The PR
          # step below authenticates via its own `token` input, not git config.
          persist-credentials: false

      - name: Free up disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Cache Gradle + Minecraft downloads
        uses: actions/cache@v4
        with:
          path: gradle-cache
          key: regen-gradle-${{ hashFiles('generator/**/*.gradle', 'tools/regen-types.sh') }}
          restore-keys: regen-gradle-

      - name: Guard skip_regen (needs a populated tools/regen-output/)
        if: ${{ inputs.skip_regen }}
        run: |
          # tools/regen-output/ is gitignored and this workflow restores no
          # artifact into it, so on a fresh hosted runner skip_regen can only
          # fail - catch it here, before the image build + LB clone burn
          # minutes. To use skip_regen, run on a self-hosted runner with the
          # output present (or add an artifact-restore step).
          if [ ! -d "tools/regen-output/@ccbluex/liquidbounce-script-api" ]; then
            echo "::error::skip_regen=true but tools/regen-output/ is empty - nothing to re-promote on this runner." >&2
            exit 1
          fi

      - name: Build the regen image
        run: docker build -f docker/Dockerfile -t lb-regen:ci .

      - name: Run the regen flow
        env:
          REGEN_ARGS: >-
            ${{ inputs.promote == false && '--no-promote' || '' }}
            ${{ inputs.skip_regen && '--no-regen' || '' }}
        run: |
          mkdir -p gradle-cache
          # Run against the checked-out repo (so it uses THIS branch's generator
          # + pipeline). Root in-container; ownership fixed afterwards - the
          # `|| rc=$?` keeps the -e step shell from skipping the chown when the
          # regen fails (artifact upload + cache post-step need a readable tree).
          rc=0
          docker run --rm --shm-size=1g \
            -e HOME=/work \
            -v "$PWD":/work \
            -v "$PWD/gradle-cache":/cache/gradle \
            lb-regen:ci $REGEN_ARGS || rc=$?
          sudo chown -R "$(id -u):$(id -g)" . || true
          exit "$rc"

      - name: Upload regen-output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regen-output
          path: tools/regen-output/
          if-no-files-found: ignore

      - name: Detect typings changes
        id: diff
        run: |
          if [[ -n "$(git status --porcelain typings/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to typings/ - generator reproduced the committed tree."
          fi

      - name: Open PR with regenerated types
        if: steps.diff.outputs.changed == 'true' && inputs.promote != false
        uses: peter-evans/create-pull-request@v6
        with:
          branch: regen/types-update
          title: "chore: regenerate script-api types"
          commit-message: "chore: regenerate script-api types (headless introspection)"
          body: |
            Automated regeneration via the headless LiquidBounce introspection flow
            (`run-regen.sh`). Review the diff before merging.
          # Keep in sync with check-regen.yml's staging list: the regen also
          # rewrites README badges and kdoc-extractor manifests; capturing only
          # typings/ would merge a PR whose badges/manifests lag the types.
          add-paths: |
            typings/
            README.md
            tools/regen-types.sh
            tools/kdoc-extractor/
          delete-branch: false
