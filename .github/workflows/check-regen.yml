name: Check upstream LiquidBounce & regenerate

# Runs daily (and on manual dispatch). Detects the current upstream LiquidBounce
# (nextgen) version + commit, and — unless we're already on it (main's pin) or a
# branch already exists for that build — bumps the pin, runs the whole regen flow
# against it, and pushes the result to a per-build branch for review. It does NOT
# publish and does NOT open a PR.
#
# The daily run is cheap when nothing changed: it resolves the upstream sha and
# skips in ~30s if main is already pinned there or the branch exists. A real
# regen only happens when upstream moves past main's pin.
#
# Same caveats as regen-types.yml: the flow launches a headless Minecraft client
# (~50-60 min on Mesa softpipe) and pulls several GB; GitHub-hosted runners are
# tight on disk/CPU — a self-hosted runner is recommended for routine use.
on:
  schedule:
    # Daily at 04:07 UTC. Off the top of the hour (GitHub delays/sheds those).
    - cron: "7 4 * * *"
  workflow_dispatch:
    inputs:
      lb_ref:
        description: "Upstream LiquidBounce ref to track (branch or SHA)"
        type: string
        default: "nextgen"

permissions:
  contents: write      # push main + tags, create releases
  actions: write       # dispatch npm-publish.yml on the auto-release path

concurrency:
  group: check-regen
  cancel-in-progress: false

jobs:
  check-regen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 1. Resolve the upstream build: commit SHA + mod_version + minecraft_version,
      #    straight from the remote (no full clone needed).
      - name: Resolve upstream LiquidBounce build
        id: lb
        env:
          # Pass the untrusted dispatch input through env (never interpolate a
          # ${{ }} expression straight into a run: script — that is a shell
          # injection surface).
          LB_REF: ${{ inputs.lb_ref }}
        run: |
          set -euo pipefail
          # On a `schedule` event there are no inputs -> default to nextgen.
          REF="${LB_REF:-nextgen}"
          SHA="$(git ls-remote https://github.com/ccbluex/liquidbounce.git "$REF" | head -n1 | cut -f1)"
          if [ -z "$SHA" ]; then
            # treat the input as a literal SHA if it didn't resolve as a ref
            SHA="$REF"
          fi
          SHORT="${SHA:0:9}"
          RAW="https://raw.githubusercontent.com/ccbluex/liquidbounce/$SHA"
          # mod_version lives in gradle.properties; the concrete Minecraft version
          # lives in gradle/libs.versions.toml (gradle.properties only has a RANGE,
          # mod_mc_version) — same source stamp-version.mjs reads.
          VER="$(curl -fsSL "$RAW/gradle.properties" | grep -E '^mod_version=' | head -n1 | cut -d= -f2 | tr -d '[:space:]')"
          MC="$(curl -fsSL "$RAW/gradle/libs.versions.toml" | grep -E '^[[:space:]]*minecraft[[:space:]]*=' | head -n1 | sed -E 's/.*=[[:space:]]*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]')"
          BRANCH="regen/lb-${VER:-unknown}-${SHORT}"
          echo "sha=$SHA"     >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "ver=$VER"     >> "$GITHUB_OUTPUT"
          echo "mc=$MC"       >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream LiquidBounce"
            echo "- version: \`${VER}\` (mc \`${MC}\`)"
            echo "- commit: \`${SHA}\`"
            echo "- target branch: \`${BRANCH}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # 2. Skip when there's nothing to do: either main is already pinned to this
      #    upstream build (we regenerated + merged it — the common case for the
      #    daily run), or a review branch for it already exists (pending merge).
      - name: Check if already done
        id: branch
        env:
          LB_SHA: ${{ steps.lb.outputs.sha }}
          LB_BRANCH: ${{ steps.lb.outputs.branch }}
        run: |
          set -euo pipefail
          CURRENT_PIN="$(grep -E '^PINNED_SHA=' tools/regen-types.sh | head -n1 | cut -d'"' -f2)"
          if [ "$CURRENT_PIN" = "$LB_SHA" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "main is already pinned to $LB_SHA — up to date, nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git ls-remote --exit-code --heads origin "$LB_BRANCH" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Branch $LB_BRANCH already exists (pending review) — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump PINNED_SHA to the upstream build
        if: steps.branch.outputs.exists == 'false'
        env:
          LB_SHA: ${{ steps.lb.outputs.sha }}
        run: |
          set -euo pipefail
          sed -i -E "s|^PINNED_SHA=.*|PINNED_SHA=\"$LB_SHA\"|" tools/regen-types.sh
          grep -n '^PINNED_SHA=' tools/regen-types.sh

      - name: Free up disk
        if: steps.branch.outputs.exists == 'false'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Cache Gradle + Minecraft downloads
        if: steps.branch.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: gradle-cache
          key: regen-gradle-${{ hashFiles('generator/**/*.gradle', 'tools/regen-types.sh') }}
          restore-keys: regen-gradle-

      # Persist the generator's per-class render cache (ModuleCache) across runs so
      # the introspection walk reuses prior renders. Correctness is enforced inside
      # the generator (each entry is keyed by jar + generator content shas), so a
      # stale restore is safe — it just yields fewer hits. Unique key per run +
      # prefix restore-keys = always restore the latest, always save a fresh copy.
      - name: Cache ModuleCache render cache
        if: steps.branch.outputs.exists == 'false'
        uses: actions/cache@v4
        with:
          path: tools/regen/.module-cache
          key: regen-modcache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: regen-modcache-${{ runner.os }}-

      # 3. Run the whole flow inside the regen container (build generator →
      #    headless introspection → manifest refresh → post-patches → promote →
      #    stamp + gate). continue-on-error: a NEW Minecraft version legitimately
      #    grows the gate's error set, which we want surfaced for review, not used
      #    to block the branch (the human re-baselines on merge). typings/ is
      #    already promoted by the time the gate runs.
      - name: Build regen image
        if: steps.branch.outputs.exists == 'false'
        run: docker build -f docker/Dockerfile -t lb-regen:ci .

      - name: Run the regen flow
        id: regen
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: |
          mkdir -p gradle-cache
          docker run --rm --shm-size=1g \
            -e HOME=/work \
            -e SKIP_GATES=1 \
            -v "$PWD":/work \
            -v "$PWD/gradle-cache":/cache/gradle \
            lb-regen:ci
          rc=$?
          # Always reclaim ownership of the container-written tree (root-owned),
          # even if the regen failed — later steps (cache save, gate, git add) and
          # the actions/cache post-step must be able to read/write it.
          sudo chown -R "$(id -u):$(id -g)" . || true
          exit $rc

      - name: Upload regen-output artifact
        if: steps.branch.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: regen-output
          path: tools/regen-output/
          if-no-files-found: ignore

      # 4. Authoritative gates (single run here; the container skips them via
      #    SKIP_GATES=1). Each is non-blocking and records a pass/fail output so
      #    the decision step can branch on it — fail-closed: anything other than a
      #    clean "pass" sends the regen to the review-branch path, never auto-ship.
      - name: Typecheck gate
        id: gate
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: |
          npm ci
          if node tools/typecheck.mjs; then
            echo "gate=pass" >> "$GITHUB_OUTPUT"; echo "Typecheck gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"; echo "Typecheck gate: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Packaging canary
        id: canary
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: |
          if tools/package-canary.sh; then echo "canary=pass" >> "$GITHUB_OUTPUT"; else echo "canary=fail" >> "$GITHUB_OUTPUT"; fi

      - name: Output sanity (registry<->types + floor + shrink)
        id: sanity
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: |
          BASE="$(git ls-tree -r --name-only origin/main -- typings/types 2>/dev/null | grep -c '\.d\.ts$' || echo 0)"
          if python3 tools/regen/check-output-sanity.py typings --baseline-count "${BASE:-0}"; then
            echo "sanity=pass" >> "$GITHUB_OUTPUT"
          else
            echo "sanity=fail" >> "$GITHUB_OUTPUT"
          fi

      # Generator unit/regression tests (Kotest) — guards the generator-root
      # fixes (ctor visibility incl. the TS2675 null-visibility case, overload
      # dedup, type-param substitution) from silently regressing. Run inside the
      # already-built regen image (JDK 21 + warm /cache/gradle from the shadowJar
      # build), so no extra toolchain/build is added. Fail-closed like the other
      # gates: a failure sets gentest=fail and the decision step routes to the
      # review branch instead of auto-releasing.
      - name: Generator regression tests
        id: gentest
        if: steps.branch.outputs.exists == 'false'
        continue-on-error: true
        run: |
          if docker run --rm -e HOME=/work \
               -v "$PWD":/work \
               -v "$PWD/gradle-cache":/cache/gradle \
               --entrypoint bash lb-regen:ci -c '
                 set -e
                 git config --global --add safe.directory "*"
                 cd /work/generator
                 JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 \
                   PATH=/usr/lib/jvm/java-21-openjdk-amd64/bin:$PATH \
                   ./gradlew --no-daemon test'; then
            echo "gentest=pass" >> "$GITHUB_OUTPUT"; echo "Generator tests: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gentest=fail" >> "$GITHUB_OUTPUT"; echo "Generator tests: FAIL" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Reclaim ownership of the container-written build tree so later steps
          # (git status, cache save) can read it.
          sudo chown -R "$(id -u):$(id -g)" . || true

      # 5. Decide: a clean regen (gate+canary+sanity pass, MC unchanged, real
      #    changes) on an enabled repo auto-ships; anything else -> review branch.
      - name: Decide auto-release vs review
        id: decide
        if: steps.branch.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain typings/ README.md tools/regen-types.sh tools/kdoc-extractor/)" ]; then
            echo "::warning::regen produced no changes (failed before promote?) — nothing to do."
            echo "auto=false" >> "$GITHUB_OUTPUT"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          NEW_MC="$(node -p "require('./typings/package.json').liquidbounce.minecraft")"
          OLD_MC="$(git show origin/main:typings/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).liquidbounce.minecraft")"
          MC_SAME=false; [ "$NEW_MC" = "$OLD_MC" ] && MC_SAME=true
          AUTO=false
          if [ "${{ vars.AUTO_RELEASE }}" = "true" ] \
             && [ "${{ steps.gate.outputs.gate }}" = "pass" ] \
             && [ "${{ steps.canary.outputs.canary }}" = "pass" ] \
             && [ "${{ steps.sanity.outputs.sanity }}" = "pass" ] \
             && [ "${{ steps.gentest.outputs.gentest }}" = "pass" ] \
             && [ "$MC_SAME" = "true" ]; then
            AUTO=true
          fi
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
          {
            echo "### Decision"
            echo "- gate: \`${{ steps.gate.outputs.gate }}\` · canary: \`${{ steps.canary.outputs.canary }}\` · sanity: \`${{ steps.sanity.outputs.sanity }}\` · gentest: \`${{ steps.gentest.outputs.gentest }}\` · mc-unchanged: \`$MC_SAME\` (was \`$OLD_MC\`, now \`$NEW_MC\`)"
            echo "- AUTO_RELEASE var: \`${{ vars.AUTO_RELEASE }}\`"
            echo "- **auto-release: $AUTO**"
          } >> "$GITHUB_STEP_SUMMARY"

      # 6a. Clean + enabled -> merge to main, tag the already-stamped version,
      #     create the release, then dispatch npm-publish.yml (the single OIDC trusted
      #     publisher) to publish. workflow_dispatch is the documented exception
      #     to "GITHUB_TOKEN events don't trigger workflows", so the dispatch
      #     actually fires; a token-created *release* would NOT, hence the dispatch.
      - name: Auto-merge + release (then dispatch publish)
        if: steps.branch.outputs.exists == 'false' && steps.decide.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LB_VER: ${{ steps.lb.outputs.ver }}
          LB_MC: ${{ steps.lb.outputs.mc }}
          LB_SHORT: ${{ steps.lb.outputs.short }}
          LB_SHA: ${{ steps.lb.outputs.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "obus-globus"
          git config user.email "254700516+obus-globus@users.noreply.github.com"
          # The version is already final: stamp-version.mjs (run during regen)
          # encodes <lb-major>.<lb-minor>.<lb-patch*1000 + scriptBuild>, where the
          # scriptBuild is the next free build for this LB patch derived from the
          # npm registry. No `npm version patch` here - that would double-bump.
          VER="$(node -p "require('./typings/package.json').version")"
          git add typings README.md tools/regen-types.sh tools/kdoc-extractor
          git commit -m "regen+release: v$VER — LiquidBounce $LB_VER (mc $LB_MC, $LB_SHORT)

          Automated clean regen against ccbluex/liquidbounce@$LB_SHA
          (gate pass, canary ok, output sanity ok, MC unchanged) — auto-releasing v$VER."
          git tag -a "v$VER" -m "v$VER" HEAD
          git push origin HEAD:main "v$VER"
          LB_BLOCK="$(node -p "JSON.stringify(require('./typings/package.json').liquidbounce, null, 2)")"
          gh release create "v$VER" --title "v$VER" --notes "$(printf 'Automated types build %s (LiquidBounce %s / MC %s).\n\nProvenance:\n```json\n%s\n```' "$VER" "$LB_VER" "$LB_MC" "$LB_BLOCK")"
          # Publish via the single trusted-publisher workflow (OIDC, no token).
          gh workflow run npm-publish.yml --ref main -f dry_run=false
          echo "✅ Auto-released **v$VER** on main; dispatched npm-publish.yml to publish." >> "$GITHUB_STEP_SUMMARY"

      # 6b. Not clean / not enabled -> push a per-build branch for human review.
      - name: Push review branch
        if: steps.branch.outputs.exists == 'false' && steps.decide.outputs.auto != 'true' && steps.decide.outputs.changed == 'true'
        env:
          LB_VER: ${{ steps.lb.outputs.ver }}
          LB_MC: ${{ steps.lb.outputs.mc }}
          LB_SHORT: ${{ steps.lb.outputs.short }}
          LB_SHA: ${{ steps.lb.outputs.sha }}
          LB_BRANCH: ${{ steps.lb.outputs.branch }}
          GATE: ${{ steps.gate.outputs.gate }}
          CANARY: ${{ steps.canary.outputs.canary }}
          SANITY: ${{ steps.sanity.outputs.sanity }}
          GENTEST: ${{ steps.gentest.outputs.gentest }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "obus-globus"
          git config user.email "254700516+obus-globus@users.noreply.github.com"
          # GITHUB_TOKEN cannot push a branch whose .github/workflows/* differ
          # from the default branch (it can't hold the `workflows` scope). If main
          # advanced its workflow files after this run checked out (e.g. a
          # concurrent edit), the review branch would carry a stale workflow diff
          # and the push would be rejected. Sync the workflow dir to the current
          # remote main first so the branch never carries a workflow delta.
          git fetch origin main --quiet || true
          git checkout origin/main -- .github 2>/dev/null || true
          git checkout -b "$LB_BRANCH"
          # Stage only the intended outputs (NOT `git add -A`: root-owned mounts
          # gradle-cache/ and tools/regen/.module-cache/ must not be committed);
          # `.github` (synced above) is added so the branch matches remote main.
          git add typings README.md tools/regen-types.sh tools/kdoc-extractor .github
          git commit -m "regen: LiquidBounce $LB_VER (mc $LB_MC, $LB_SHORT)

          Automated regen against ccbluex/liquidbounce@$LB_SHA.
          gate=$GATE canary=$CANARY sanity=$SANITY gentest=$GENTEST.
          Needs review (a gate/canary/sanity/gentest not all-clean, an MC bump, or auto-release disabled)."
          git push origin "$LB_BRANCH"
          echo "Pushed review branch \`$LB_BRANCH\` (needs a human)." >> "$GITHUB_STEP_SUMMARY"

      # Human-in-the-loop signal. The review-branch path is otherwise silent (a
      # branch appears + a step summary you'd only see by opening the run), so
      # ping Discord (where the owner watches) via a webhook.
      # FAIL-OPEN - unlike the gates (fail-closed), a notification failure must
      # NEVER block or break the pipeline: continue-on-error + `|| true`, and a
      # graceful skip if the DISCORD_WEBHOOK secret is absent.
      - name: Notify — regen needs review
        if: steps.branch.outputs.exists == 'false' && steps.decide.outputs.auto != 'true' && steps.decide.outputs.changed == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LB_VER: ${{ steps.lb.outputs.ver }}
          LB_MC: ${{ steps.lb.outputs.mc }}
          LB_SHORT: ${{ steps.lb.outputs.short }}
          LB_BRANCH: ${{ steps.lb.outputs.branch }}
          GATE: ${{ steps.gate.outputs.gate }}
          CANARY: ${{ steps.canary.outputs.canary }}
          SANITY: ${{ steps.sanity.outputs.sanity }}
          GENTEST: ${{ steps.gentest.outputs.gentest }}
        run: |
          [ -n "${DISCORD_WEBHOOK:-}" ] || { echo "::warning::DISCORD_WEBHOOK secret not set - skipping notify"; exit 0; }
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          BRANCH_URL="$SERVER_URL/$REPO/tree/$LB_BRANCH"
          # printf %s (not string interpolation) keeps the upstream-derived values
          # out of the format string; jq escapes them for JSON; <> suppresses the
          # Discord link previews.
          CONTENT="$(printf '🔁 **Regen needs review**: LiquidBounce %s (mc %s, `%s`)\nRouted to a review branch instead of auto-releasing.\nGates: gate=`%s` canary=`%s` sanity=`%s` gentest=`%s`\nBranch: <%s>\nRun: <%s>' \
            "$LB_VER" "$LB_MC" "$LB_SHORT" "$GATE" "$CANARY" "$SANITY" "$GENTEST" "$BRANCH_URL" "$RUN_URL")"
          jq -nc --arg c "$CONTENT" '{content:$c}' \
            | curl -sS -m 15 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
            || echo "::warning::Discord notify (needs-review) failed - non-blocking, review branch \`$LB_BRANCH\` still pushed."

      # Catch-all for a HARD failure (regen crash, image build, an uncaught
      # step) that never reached the review/release routing — otherwise the only
      # signal is GitHub's default scheduled-failure email to the workflow's
      # account. Also fail-open.
      - name: Notify — regen job failed
        if: failure() && steps.branch.outputs.exists == 'false'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LB_VER: ${{ steps.lb.outputs.ver }}
          LB_SHORT: ${{ steps.lb.outputs.short }}
        run: |
          [ -n "${DISCORD_WEBHOOK:-}" ] || { echo "::warning::DISCORD_WEBHOOK secret not set - skipping notify"; exit 0; }
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          CONTENT="$(printf '🛑 **Regen FAILED**: LiquidBounce %s (`%s`)\nThe job failed before it could route to a review branch or release.\nRun: <%s>' \
            "$LB_VER" "$LB_SHORT" "$RUN_URL")"
          jq -nc --arg c "$CONTENT" '{content:$c}' \
            | curl -sS -m 15 -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK" \
            || echo "::warning::Discord notify (job-failed) failed - non-blocking."
