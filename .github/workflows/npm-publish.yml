name: Publish to npm

# Publishes the typings/ package (@wunk/lb-script-api-types). Types-only —
# no build step. Version is `<lb-major>.<lb-minor>.<iteration>`: major.minor track
# the LiquidBounce release line, the patch is our own iteration (see
# docs/versioning.md). The exact LB build is in the package.json `liquidbounce`
# block. After publishing, an `lb-<major>.<minor>` dist-tag (e.g. `lb-0.38`) is
# pointed at this version so consumers can `npm i ...@lb-0.38`.
#
# Access is controlled by publishConfig.access ("public"). Needs a repo/org secret
# NPM_TOKEN with publish rights for the @wunk scope.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (npm pack, no publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC: lets npm trusted publishing authenticate this workflow
                    # (no long-lived NPM_TOKEN). Configure the trusted publisher on
                    # npmjs.com for @wunk/lb-script-api-types -> this repo + workflow.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@wunk"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Resolve name + version
        id: pkg
        working-directory: typings
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          # LB line dist-tag: lb-<major>.<minor> (e.g. lb-0.38).
          lbtag="lb-$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")"
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "lbtag=$lbtag"     >> "$GITHUB_OUTPUT"
          echo "Package: $name@$version (LB $(node -p "require('./package.json').liquidbounce.version")) dist-tag $lbtag"

      - name: Verify package contents
        working-directory: typings
        run: npm pack --dry-run

      - name: Already published?
        id: exists
        working-directory: typings
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} already on npm — bump the LB pin / version to publish a new one."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # Authenticated via OIDC trusted publishing (no token) — needs the
        # id-token: write permission above + a trusted publisher configured on
        # npmjs.com. npm also attaches build provenance automatically.
        if: >-
          steps.exists.outputs.published == 'false' &&
          (github.event_name == 'release' || inputs.dry_run == false)
        working-directory: typings
        run: npm publish

      - name: Point lb-<minor> dist-tag at this version
        # Best-effort: `dist-tag add` is a separate registry call that may not
        # reuse the publish step's short-lived OIDC credential. Non-fatal — the
        # publish itself is what matters; if this is skipped/fails, set it with
        # `npm dist-tag add <pkg>@<ver> lb-<minor>` (a granular token / local
        # `npm login`). `dist-tag add` is an idempotent upsert.
        if: >-
          github.event_name == 'release' || inputs.dry_run == false
        continue-on-error: true
        working-directory: typings
        run: |
          npm dist-tag add "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" \
            "${{ steps.pkg.outputs.lbtag }}"
          echo "::notice::${{ steps.pkg.outputs.lbtag }} -> ${{ steps.pkg.outputs.version }}"
