name: Publish to npm

# Publishes the typings/ package (@wunk/lb-script-api-types). Types-only —
# no build step. Version is `<lb-major>.<lb-minor>.<iteration>`: major.minor track
# the LiquidBounce release line, the patch is our own iteration (see
# docs/versioning.md). The exact LB build is in the package.json `liquidbounce`
# block. Consumers pin a LiquidBounce line with a semver range,
# `npm i @wunk/lb-script-api-types@^0.38.0` (newest 0.38-line types, stops before
# 0.39) — so no custom dist-tag is maintained.
#
# Access is controlled by publishConfig.access ("public"). Authentication is npm
# OIDC trusted publishing (id-token below) — no long-lived NPM_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (npm pack, no publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC: lets npm trusted publishing authenticate this workflow
                    # (no long-lived NPM_TOKEN). Configure the trusted publisher on
                    # npmjs.com for @wunk/lb-script-api-types -> this repo + workflow.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@wunk"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; node 22 ships npm 10.x.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Resolve name + version
        id: pkg
        working-directory: typings
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package: $name@$version (LB $(node -p "require('./package.json').liquidbounce.version"))"

      - name: Verify package contents
        working-directory: typings
        run: npm pack --dry-run

      - name: Already published?
        id: exists
        working-directory: typings
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} already on npm — bump the LB pin / version to publish a new one."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # Authenticated via OIDC trusted publishing (no token) — needs the
        # id-token: write permission above + a trusted publisher configured on
        # npmjs.com. npm also attaches build provenance automatically.
        if: >-
          steps.exists.outputs.published == 'false' &&
          (github.event_name == 'release' || inputs.dry_run == false)
        working-directory: typings
        run: npm publish
